<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Admission Registration Form</title>

    <link rel="stylesheet" href="form.css">

</head>

<body>

    <div class="container">

        <div class="form-box">

            <h1>College Admission Registration Form</h1>
            <p>Please fill in your details carefully.</p>

            <form id="admissionForm">

                <!-- Student Name -->

                <div class="input-group">
                    <label>Student Name *</label>
                    <input type="text" id="name">
                    <span class="error" id="nameError"></span>
                </div>

                <!-- Father Name -->

                <div class="input-group">
                    <label>Father's Name *</label>
                    <input type="text" id="father">
                    <span class="error" id="fatherError"></span>
                </div>

                <!-- Mother Name -->

                <div class="input-group">
                    <label>Mother's Name *</label>
                    <input type="text" id="mother">
                    <span class="error" id="motherError"></span>
                </div>

                <!-- DOB -->

                <div class="input-group">
                    <label>Date of Birth *</label>
                    <input type="date" id="dob">
                    <span class="error" id="dobError"></span>
                </div>

                <!-- Gender -->

                <div class="input-group">
                    <label>Gender *</label>

                    <div class="gender">

                        <input type="radio" name="gender" value="Male"> Male

                        <input type="radio" name="gender" value="Female"> Female

                        <input type="radio" name="gender" value="Other"> Other

                    </div>

                    <span class="error" id="genderError"></span>

                </div>

                <!-- Email -->

                <div class="input-group">
                    <label>Email *</label>
                    <input type="email" id="email">
                    <span class="error" id="emailError"></span>
                </div>

                <!-- Phone -->

                <div class="input-group">
                    <label>Phone Number *</label>
                    <input type="text" id="phone">
                    <span class="error" id="phoneError"></span>
                </div>

                <!-- Address -->

                <div class="input-group">
                    <label>Address *</label>
                    <textarea id="address" rows="4"></textarea>
                    <span class="error" id="addressError"></span>
                </div>

                <!-- City -->

                <div class="input-group">
                    <label>City *</label>
                    <input type="text" id="city">
                    <span class="error" id="cityError"></span>
                </div>

                <!-- State -->

                <div class="input-group">
                    <label>State *</label>

                    <select id="state">

                        <option value="">Select State</option>

                        <option>Tamil Nadu</option>

                        <option>Kerala</option>

                        <option>Karnataka</option>

                        <option>Andhra Pradesh</option>

                        <option>Telangana</option>

                    </select>

                    <span class="error" id="stateError"></span>

                </div>

                <!-- Pincode -->

                <div class="input-group">
                    <label>Pincode *</label>
                    <input type="text" id="pincode">
                    <span class="error" id="pincodeError"></span>
                </div>

                <!-- Department -->

                <div class="input-group">
                    <label>Department *</label>

                    <select id="department">

                        <option value="">Select Department</option>

                        <option>Artificial Intelligence & Data Science</option>

                        <option>Computer Science Engineering</option>

                        <option>Information Technology</option>

                        <option>Electronics & Communication</option>

                        <option>Mechanical Engineering</option>

                    </select>

                    <span class="error" id="departmentError"></span>

                </div>

                <!-- HSC Percentage -->

                <div class="input-group">
                    <label>12th Percentage *</label>
                    <input type="number" id="percentage">
                    <span class="error" id="percentageError"></span>
                </div>

                <!-- Password -->

                <div class="input-group">
                    <label>Password *</label>
                    <input type="password" id="password">
                    <span class="error" id="passwordError"></span>
                </div>

                <!-- Confirm Password -->

                <div class="input-group">
                    <label>Confirm Password *</label>
                    <input type="password" id="confirmPassword">
                    <span class="error" id="confirmPasswordError"></span>
                </div>

                <!-- Photo -->

                <div class="input-group">
                    <label>Upload Passport Size Photo</label>
                    <input type="file" id="photo">
                </div>

                <!-- Terms -->

                <div class="checkbox">

                    <input type="checkbox" id="terms">

                    <label>I agree to the Terms & Conditions *</label>

                </div>

                <span class="error" id="termsError"></span>

                <br>

                <button type="submit">

                    Register Now

                </button>

                <button type="reset">

                    Reset

                </button>

            </form>

        </div>

    </div>

    <script src="form.js"></script>

</body>

</html>
