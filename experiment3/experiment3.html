<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Management App</title>

    <link rel="stylesheet" href="task.css">

</head>

<body>

    <div class="container">

        <div class="todo-box">

            <h1>📝 Task Management App</h1>

            <p>Manage your daily tasks easily</p>

            <!-- Add Task -->

            <div class="input-section">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task...">

                <button id="addBtn">
                    Add Task
                </button>

            </div>

            <!-- Task Counter -->

            <div class="task-info">

                <div class="card">

                    <h3 id="totalTasks">0</h3>

                    <p>Total Tasks</p>

                </div>

                <div class="card">

                    <h3 id="completedTasks">0</h3>

                    <p>Completed</p>

                </div>

                <div class="card">

                    <h3 id="pendingTasks">0</h3>

                    <p>Pending</p>

                </div>

            </div>

            <!-- Task List -->

            <div class="task-list">

                <ul id="taskList">

                    <!-- Tasks will appear here -->

                </ul>

            </div>

            <!-- Footer -->

            <div class="footer">

                <button id="clearAll">

                    Clear All Tasks

                </button>

            </div>

        </div>

    </div>

    <script src="task.js"></script>

</body>

</html>
