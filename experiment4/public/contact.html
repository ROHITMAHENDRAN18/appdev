<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Antigravity</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </nav>
    <div class="container" style="animation-delay: -4s;">
        <h1>Transmit Signal</h1>
        <p>Send a message back to Earth.</p>
        <form action="/contact" method="POST">
            <input type="text" name="name" placeholder="Pilot Name" required>
            <input type="email" name="email" placeholder="Coordinates (Email)" required>
            <textarea name="message" rows="4" placeholder="Your transmission..." required></textarea>
            <button type="submit">Launch Payload</button>
        </form>
    </div>
</body>
</html>
