<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIT Platform</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="shared-app.js"></script>
</head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-logo">O</div>
            <div><strong>ORBIT</strong><small>ADMIN PORTAL</small></div>
        </div>
        <div class="nav-label">ADMINISTRATION</div>
        <nav>
            <a href="AdminDashboard.html">🏠 <span>Dashboard</span></a>
            <a href="AdminUsers.html">👥 <span>Users</span></a>
            <a href="AdminCompanies.html" class="active">🏢 <span>Companies</span></a>
            <a href="AdminInternships.html">💼 <span>Internships</span></a>
            <a href="AdminTraining.html">📚 <span>Training</span></a>
            <a href="AdminReports.html">📊 <span>Reports</span></a>
        </nav>
        <div class="sidebar-bottom">
            <a href="RoleDashboards.html" class="portal-link">← Role Portal</a>
        </div>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-topbar">
            <div class="dashboard-title">
                <h1>Registered Companies</h1>
                <p>Verify corporate partners, assign primary recruiters, and track job postings.</p>
            </div>
            <div class="role-badge">⚙️ ADMINISTRATOR</div>
        </header>

        <section id="companiesGrid" class="card-grid"></section>
    </main>
</div>

<script>
function renderCompanies() {
    const companies = JSON.parse(localStorage.getItem(ORBIT_KEYS.COMPANIES)) || [];
    const grid = document.getElementById('companiesGrid');

    grid.innerHTML = companies.map(c => `
        <article class="item-card">
            <div class="company-row">
                <div class="company-logo">${c.name.substring(0,2).toUpperCase()}</div>
                <div>
                    <h3>${c.name}</h3>
                    <p>${c.industry} • ${c.location}</p>
                </div>
            </div>
            <div class="internship-details" style="margin-top:20px;">
                <div class="detail-item"><span>Recruiter</span><strong>${c.recruiter}</strong></div>
                <div class="detail-item"><span>Status</span><strong>${c.status}</strong></div>
            </div>
        </article>
    `).join('');
}
document.addEventListener('DOMContentLoaded', renderCompanies);
</script>
</body>
</html>
