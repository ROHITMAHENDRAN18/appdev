<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIT Platform</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="shared-app.js"></script>
</head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-logo">O</div>
            <div><strong>ORBIT</strong><small>ADMIN PORTAL</small></div>
        </div>
        <div class="nav-label">ADMINISTRATION</div>
        <nav>
            <a href="AdminDashboard.html">🏠 <span>Dashboard</span></a>
            <a href="AdminUsers.html">👥 <span>Users</span></a>
            <a href="AdminCompanies.html">🏢 <span>Companies</span></a>
            <a href="AdminInternships.html">💼 <span>Internships</span></a>
            <a href="AdminTraining.html">📚 <span>Training</span></a>
            <a href="AdminReports.html" class="active">📊 <span>Reports</span></a>
        </nav>
        <div class="sidebar-bottom">
            <a href="RoleDashboards.html" class="portal-link">← Role Portal</a>
        </div>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-topbar">
            <div class="dashboard-title">
                <h1>Platform Activity & Reports</h1>
                <p>System metrics across users, corporate partners, and student placements.</p>
            </div>
            <div class="role-badge">⚙️ ADMINISTRATOR</div>
        </header>

        <section class="content-grid even">
            <div class="panel">
                <div class="panel-header"><h2>Role Distribution Summary</h2></div>
                <div class="bar-chart" id="userRolesChart"></div>
            </div>
        </section>
    </main>
</div>

<script>
function renderAdminReports() {
    const users = JSON.parse(localStorage.getItem(ORBIT_KEYS.USERS)) || [];
    const roles = ['Student', 'Manager', 'Recruiter', 'Training Coordinator', 'Administrator'];
    const total = users.length || 1;

    document.getElementById('userRolesChart').innerHTML = roles.map(r => {
        const count = users.filter(u => u.role === r).length;
        return `
            <div class="bar-row">
                <div class="bar-label">${r}</div>
                <div class="bar-track"><div class="bar-fill" style="width:${Math.round((count/total)*100)}%"></div></div>
                <div class="bar-value">${count}</div>
            </div>
        `;
    }).join('');
}
document.addEventListener('DOMContentLoaded', renderAdminReports);
</script>
</body>
</html>
