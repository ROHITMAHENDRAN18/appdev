<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIT Platform</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="shared-app.js"></script>
</head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-logo">O</div>
            <div><strong>ORBIT</strong><small>MANAGER PORTAL</small></div>
        </div>
        <div class="nav-label">MANAGEMENT</div>
        <nav>
            <a href="ManagerDashboard.html">🏠 <span>Dashboard</span></a>
            <a href="ManagerApplications.html">📄 <span>Applications</span></a>
            <a href="ManagerStudents.html">👥 <span>Students</span></a>
            <a href="ManagerInternships.html" class="active">💼 <span>Internships</span></a>
            <a href="ManagerReports.html">📊 <span>Reports</span></a>
            <a href="ManagerNotifications.html">🔔 <span>Notifications</span></a>
        </nav>
        <div class="sidebar-bottom">
            <a href="RoleDashboards.html" class="portal-link">← Role Portal</a>
        </div>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-topbar">
            <div class="dashboard-title">
                <h1>Active Internships Overview</h1>
                <p>Review registered company listings and active applicant counts.</p>
            </div>
            <div class="role-badge">🧑‍💼 MANAGER</div>
        </header>

        <section id="managerJobsGrid" class="card-grid"></section>
    </main>
</div>

<script>
function renderManagerJobs() {
    const jobs = JSON.parse(localStorage.getItem(ORBIT_KEYS.INTERNSHIPS)) || [];
    const apps = JSON.parse(localStorage.getItem(ORBIT_KEYS.APPLICATIONS)) || [];
    const grid = document.getElementById('managerJobsGrid');

    grid.innerHTML = jobs.map(j => {
        const count = apps.filter(a => a.jobId === j.id).length;
        return `
            <article class="item-card">
                <div class="company-row">
                    <div class="company-logo">${j.company.substring(0,2).toUpperCase()}</div>
                    <div>
                        <h3>${j.company}</h3>
                        <p>📍 ${j.location}</p>
                    </div>
                </div>
                <h2 class="internship-title">${j.title}</h2>
                <div class="internship-details">
                    <div class="detail-item"><span>Status</span><strong>${j.status}</strong></div>
                    <div class="detail-item"><span>Total Applicants</span><strong>${count} Students</strong></div>
                </div>
            </article>
        `;
    }).join('');
}
document.addEventListener('DOMContentLoaded', renderManagerJobs);
</script>
</body>
</html>
