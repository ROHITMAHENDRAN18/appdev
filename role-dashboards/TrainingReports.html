<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIT Platform</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="shared-app.js"></script>
</head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-logo">O</div>
            <div><strong>ORBIT</strong><small>TRAINING PORTAL</small></div>
        </div>
        <div class="nav-label">COORDINATOR MENU</div>
        <nav>
            <a href="TrainingCoordinatorDashboard.html">🏠 <span>Dashboard</span></a>
            <a href="TrainingPrograms.html">📚 <span>Programs</span></a>
            <a href="TrainingAssignments.html">👥 <span>Assignments</span></a>
            <a href="TrainingProgress.html">📈 <span>Progress Track</span></a>
            <a href="TrainingCertificates.html">🏆 <span>Certificates</span></a>
            <a href="TrainingReports.html" class="active">📊 <span>Reports</span></a>
        </nav>
        <div class="sidebar-bottom">
            <a href="RoleDashboards.html" class="portal-link">← Role Portal</a>
        </div>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-topbar">
            <div class="dashboard-title">
                <h1>Training Program Analytics</h1>
                <p>Metrics on completion rate, enrollment numbers, and skill acquisition.</p>
            </div>
            <div class="role-badge">📚 COORDINATOR</div>
        </header>

        <section class="content-grid even">
            <div class="panel">
                <div class="panel-header"><h2>Student Completion Overview</h2></div>
                <div class="bar-chart" id="coordinatorChart"></div>
            </div>
        </section>
    </main>
</div>

<script>
function renderTrainingReports() {
    const assignments = JSON.parse(localStorage.getItem(ORBIT_KEYS.ASSIGNMENTS)) || [];
    document.getElementById('coordinatorChart').innerHTML = assignments.map(a => `
        <div class="bar-row">
            <div class="bar-label">${a.studentName}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${a.progress}%"></div></div>
            <div class="bar-value">${a.progress}%</div>
        </div>
    `).join('');
}
document.addEventListener('DOMContentLoaded', renderTrainingReports);
</script>
</body>
</html>
